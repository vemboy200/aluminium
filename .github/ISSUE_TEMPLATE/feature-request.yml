name: Feature request
description: Suggest an idea
labels: ["feat"]
title: "[FR]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting this request, please search existing issues and make sure it's unique.

        Aluminium is about bringing Arc's features to Helium. If you're asking for an Arc feature, say which one and how it worked in Arc.
  - type: input
    id: description
    attributes:
      label: Description
      description: A clear and concise description (in one line) of what your suggestion is
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Who's implementing?
      options:
        - label: I'm willing to implement this feature myself (AI help is fine, as long as it's tested on a real system)
  - type: textarea
    id: prob
    attributes:
      label: The problem
      description: Please describe the problem you are solving or new feature you're suggesting
      placeholder: In Arc I could [...], but in Helium/Aluminium [...]
    validations:
      required: true
  - type: textarea
    id: sol
    attributes:
      label: Possible solutions
      description: Please describe possible solution(-s) to your problem
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the feature request here
